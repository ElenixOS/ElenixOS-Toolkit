name: Get Marketplace User ID

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  identify:
    name: Resolve Entra identity in Azure DevOps
    runs-on: ubuntu-latest
    environment: marketplace

    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve Azure DevOps profile ID
        shell: bash
        run: |
          user_id="$(az rest \
            --url "https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1" \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id \
            --output tsv)"

          if [[ -z "$user_id" ]]; then
            echo "Azure DevOps did not return a profile ID."
            exit 1
          fi

          echo "Marketplace User ID: $user_id"
